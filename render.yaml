# Render Blueprint: Render -> New -> Blueprint -> pick this repo.
# Rexera CRM 2.0 Web Service with live Node server & Hostinger SMTP email dispatch.
services:
  - type: web
    name: rexera-crm
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    pullRequestPreviewsEnabled: false
    envVars:
      - key: PORT
        value: "5180"
      - key: NODE_VERSION
        value: "22"
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: no-reply@hr.rexera.in
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: '"Rexera CRM" <no-reply@hr.rexera.in>'
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_HOURLY_LIMIT
        value: "150"
      - key: AI_DAILY_LIMIT
        value: "1500"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
