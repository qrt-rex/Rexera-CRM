# Render Blueprint: Render -> New -> Blueprint -> pick this repo.
# The CRM is a static Vite build; the Blutec dialer runs as the Supabase Edge Function `blutec`, not on Render.
services:
  - type: web
    name: rexera-crm
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # BrowserRouter: send every page path (/leads, /login, …) to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
