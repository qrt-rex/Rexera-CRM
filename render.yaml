# Render Blueprint: Render -> New -> Blueprint -> pick this repo.
# Rexera CRM 2.0 Web Service with live Node server & Hostinger SMTP email dispatch.
services:
  - type: web
    name: rexera-crm
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    pullRequestPreviewsEnabled: false
    envVars:
      - key: PORT
        value: "5180"
      - key: NODE_VERSION
        value: "22"
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: no-reply@hr.rexera.in
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: '"Rexera CRM" <no-reply@hr.rexera.in>'
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: BLUTEC_KEY_ID
        sync: false
      - key: BLUTEC_API_KEY
        sync: false
      - key: BLUTEC_SIGNING_SECRET
        sync: false
      - key: BLUTEC_TOKEN
        sync: false
      - key: BLUTEC_IVR_EMAIL
        sync: false
      - key: BLUTEC_IVR_PASSWORD
        sync: false
